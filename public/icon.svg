    <line x1="62" y1="20" x2="70" y2="4" stroke="#0e7490" stroke-width="5" stroke-linecap="round" />
    <circle cx="30" cy="4" r="6" fill="#22d3ee" />
    <circle cx="70" cy="4" r="6" fill="#22d3ee" />

